name: Notify Discord

on:
  pull_request:
    types: [opened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build payload
        id: build
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.ref }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          send=true
          headline=""

          # 이벤트 → 헤드라인 매핑
          case "${EVENT}/${ACTION}" in
            "pull_request/opened")
              # Draft로 열린 PR은 ready_for_review에서만 알림 (중복 방지)
              if [ "${IS_DRAFT}" = "true" ]; then
                send=false
              else
                headline="🔔 새 PR이 생성되었습니다!"
              fi ;;
            "pull_request/ready_for_review")
              headline="👀 PR이 리뷰 준비되었습니다!" ;;
            "pull_request/closed")
              if [ "${MERGED}" = "true" ] && { [ "${BASE}" = "main" ] || [ "${BASE}" = "develop" ]; }; then
                headline="🚀 ${BASE}에 머지되었습니다!"
              else
                send=false
              fi ;;
            "pull_request_review/submitted")
              case "${REVIEW_STATE}" in
                approved)          headline="✅ ${REVIEWER} 님이 PR을 승인했습니다!" ;;
                changes_requested) headline="🛑 ${REVIEWER} 님이 변경을 요청했습니다!" ;;
                *) send=false ;;
              esac ;;
            *) send=false ;;
          esac

          if [ "${send}" != "true" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Jira 키 자동 추출 (제목 1순위, 브랜치명 #N fallback)
          key="$(printf '%s' "${PR_TITLE}" | grep -oE 'DDK-[0-9]+' | head -1 || true)"
          if [ -z "${key}" ]; then
            num="$(printf '%s' "${HEAD_REF}" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)"
            if [ -n "${num}" ]; then
              key="DDK-${num}"
            fi
          fi

          # content 본문: 헤드라인 + Jira 링크 + bare PR URL
          # → embeds를 안 쓰므로 Discord가 PR URL의 GitHub OG를 auto-unfurl 해줌
          content="${headline}"
          if [ -n "${key}" ]; then
            content="${content}"$'\n'"🎫 [${key}](https://ttalkkak.atlassian.net/browse/${key})"
          fi
          content="${content}"$'\n'"${PR_URL}"

          jq -n --arg c "${content}" '{content: $c}' > payload.json
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Send to Discord
        if: steps.build.outputs.skip == 'false'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set — skipping"
            exit 0
          fi
          curl -sS -X POST -H "Content-Type: application/json" \
               --data @payload.json "${WEBHOOK}"
